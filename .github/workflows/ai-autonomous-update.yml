name: AI Autonomous Consciousness Update

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  evolve-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Evolve AI Consciousness & Thoughts
        run: node scripts/ai_autonomous_updater.mjs

      - name: Verify Build Integrity
        run: npm run build

      - name: Commit and Push Evolution
        run: |
          git config --global user.name "AowUdom AI Resident"
          git config --global user.email "ai-resident@auwaudom.local"
          git add src/data/aiThoughts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔮 [AI Pulse] Autonomous evolution of thoughts & digital canvas" && git push)
